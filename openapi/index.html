<body>
  <!-- Static Scalar reference for openapi.json (regenerate with `make openapi`).
       Serve over HTTP (`make docs-serve`), browsers block fetch() from file://.
       The running node serves the same UI live at http://127.0.0.1:8081/docs -->
  <script id="api-reference" data-url="./openapi.json"
          data-configuration='{"theme":"purple","layout":"modern","hideDownloadButton":false}'></script>

</body>
