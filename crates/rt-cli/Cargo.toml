[package]
name = "rt-cli"
description = "21ci: command line client for the control API of the 21 Cloud Functions Runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["serverless", "functions", "cli", "deploy", "faas"]
categories = ["command-line-utilities"]
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "21ci"
path = "src/main.rs"

# Deliberately light: no runtime/V8/wasmtime crates, no async runtime of our own
# (reqwest's blocking client is enough for a one-shot CLI).
[dependencies]
clap.workspace = true
clap_complete.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
humantime.workspace = true
base64.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
httpmock.workspace = true
tempfile.workspace = true
