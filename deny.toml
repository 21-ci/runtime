# cargo-deny (https://embarkstudios.github.io/cargo-deny/): `cargo deny check`.
# Advisories from RustSec, licenses compatible with Apache-2.0, duplicate versions as warnings,
# crates only from crates.io.

[graph]
all-features = false

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Each ignore needs a reason and is reviewed when its dependency moves.
ignore = [
  # hickory-proto 0.25 only through deno_fetch (=0.283, Deno's own fetch client, unused: guest fetch
  # goes through rt-host's egress guard). Our resolver is on hickory 0.26. No DNSSEC feature.
  { id = "RUSTSEC-2026-0118", reason = "DNSSEC validation is not enabled; hickory 0.25 is deno_fetch's" },
  { id = "RUSTSEC-2026-0119", reason = "encoding of our own queries; hickory 0.25 is deno_fetch's" },
  # rustls is pinned =0.23.40 by deno_tls (every release up to 0.247); revisit with the next Deno bump.
  { id = "RUSTSEC-2026-0285", reason = "pinned by deno_tls; transcript stays authenticated" },
  { id = "RUSTSEC-2026-0346", reason = "pinned by deno_tls; session values are never Debug-printed" },
  { id = "RUSTSEC-2026-0348", reason = "pinned by deno_tls; brotli certificate compression is not enabled" },
  { id = "RUSTSEC-2026-0349", reason = "pinned by deno_tls; downgrade is to classical key exchange, still authenticated" },
  # rsa through deno_crypto (WebCrypto in the guest's own isolate): no network-observable timing.
  { id = "RUSTSEC-2023-0071", reason = "deno_crypto; no fixed rsa release exists" },
  # rand 0.8 pinned by deno_crypto; the unsoundness needs `rand::rng()` (0.9+) with a custom logger.
  { id = "RUSTSEC-2026-0097", reason = "pinned by deno_crypto; trigger not reachable on 0.8" },
  # zip: only `ZipArchive::extract` / `ZipStreamReader::extract` are affected; rt-build reads entries
  # itself and refuses links, `..` and absolute paths (crates/rt-build/src/extract.rs).
  { id = "RUSTSEC-2026-0367", reason = "extract() is never called" },
  { id = "RUSTSEC-2026-0368", reason = "extract() is never called" },
  { id = "RUSTSEC-2026-0369", reason = "extract() is never called" },
  # Unmaintained, no known vulnerability: proc-macro (paste, via utoipa-axum) and Deno's deps.
  { id = "RUSTSEC-2024-0436", reason = "paste is a build-time proc-macro" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile via deno_native_certs" },
  { id = "RUSTSEC-2026-0249", reason = "smartstring via deno_ast/swc" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses compatible with Apache-2.0 (and weak copyleft used file-by-file).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]

[licenses.private]
# The workspace crates are `publish = false` and Apache-2.0 (LICENSE); only third-party crates are checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
