[package]
name = "edge-gateway"
version = "1.0.0"
edition = "2021"
publish = false

# A cdylib built for `wasm32-wasip2` is a WebAssembly component (rustc runs wasm-component-ld).
# The rlib lets `cargo test` run the pure modules (token, request, ratelimit, audit, config) on the host.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# wasi:http types and the `wasi:http/incoming-handler` export (world wasi:http/proxy).
wasip2 = "2"
# Bindings for the runtime's own imports, from the vendored wit/rt-host.wit (package std:host@0.1.0).
wit-bindgen = "0.62"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# Standalone crate, not a member of the runtime workspace.
[workspace]
