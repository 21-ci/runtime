<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="Architecture: clients reach the public, control and metrics listeners of one rt process; triggers feed the scheduler, which runs tasks on Deno isolates or WASM instances with host capabilities over local storage">
  <title>rt architecture</title>
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f6f8fa; stroke: #d0d7de; }
    .box { fill: #ffffff; stroke: #8c959f; }
    .accent { fill: #eef3ff; stroke: #4f7cff; }
    .teal { fill: #ecfdf8; stroke: #14b8a6; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .line { stroke: #8c959f; fill: none; }
    .arrow { fill: #8c959f; }
    text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .node { fill: #161b22; stroke: #30363d; }
      .box { fill: #0d1117; stroke: #6e7681; }
      .accent { fill: #121d33; stroke: #4f7cff; }
      .teal { fill: #0f2420; stroke: #14b8a6; }
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .line { stroke: #6e7681; }
      .arrow { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="520" rx="12"/>

  <!-- clients -->
  <g font-size="13">
    <rect class="box" x="40" y="20" width="230" height="46" rx="8"/>
    <text class="t" x="155" y="40" text-anchor="middle" font-weight="600">Users, webhooks, browsers</text>
    <text class="m" x="155" y="57" text-anchor="middle">HTTP, WebSocket (TLS at your proxy)</text>
    <rect class="box" x="325" y="20" width="230" height="46" rx="8"/>
    <text class="t" x="440" y="40" text-anchor="middle" font-weight="600">Operators, CI, coding agents</text>
    <text class="m" x="440" y="57" text-anchor="middle">21ci, REST /v1, MCP, OpenAPI</text>
    <rect class="box" x="610" y="20" width="230" height="46" rx="8"/>
    <text class="t" x="725" y="40" text-anchor="middle" font-weight="600">Prometheus, load balancer</text>
    <text class="m" x="725" y="57" text-anchor="middle">/metrics /healthz /readyz</text>
  </g>

  <!-- process -->
  <rect class="node" x="20" y="96" width="840" height="300" rx="12"/>
  <text class="m" x="844" y="392" font-size="11" font-weight="600" text-anchor="end" letter-spacing="0.5">rt: one process, one data volume</text>

  <g font-size="12">
    <rect class="box" x="40" y="128" width="230" height="30" rx="6"/>
    <text class="t" x="155" y="148" text-anchor="middle">public :8080   /s/{slug}/…, custom hosts</text>
    <rect class="box" x="325" y="128" width="230" height="30" rx="6"/>
    <text class="t" x="440" y="148" text-anchor="middle">control :8081   auth, scopes, quotas</text>
    <rect class="box" x="610" y="128" width="230" height="30" rx="6"/>
    <text class="t" x="725" y="148" text-anchor="middle">metrics :9090</text>
  </g>
  <path class="line" d="M155 66 V128" marker-end="url(#a)"/>
  <path class="line" d="M440 66 V128" marker-end="url(#a)"/>
  <path class="line" d="M725 66 V128" marker-end="url(#a)"/>

  <!-- triggers -->
  <rect class="box" x="40" y="176" width="230" height="96" rx="8"/>
  <text class="t" x="56" y="198" font-size="14" font-weight="600">Triggers</text>
  <text class="m" x="56" y="218" font-size="12">HTTP routes, interval + cron schedules</text>
  <text class="m" x="56" y="236" font-size="12">durable queues + DLQ, service calls</text>
  <text class="m" x="56" y="254" font-size="12">WebSockets held by the node</text>
  <path class="line" d="M155 158 V176" marker-end="url(#a)"/>

  <!-- build -->
  <rect class="box" x="325" y="176" width="230" height="96" rx="8"/>
  <text class="t" x="341" y="198" font-size="14" font-weight="600">Build + prepared cache</text>
  <text class="m" x="341" y="218" font-size="12">TS transpile, npm:/jsr: at build time</text>
  <text class="m" x="341" y="236" font-size="12">rt.lock, content-addressed artifacts</text>
  <text class="m" x="341" y="254" font-size="12">V8 code cache, precompiled WASM</text>
  <path class="line" d="M440 158 V176" marker-end="url(#a)"/>

  <!-- security / tenancy -->
  <rect class="box" x="610" y="176" width="230" height="96" rx="8"/>
  <text class="t" x="626" y="198" font-size="14" font-weight="600">Tenancy + security</text>
  <text class="m" x="626" y="218" font-size="12">tenants, plans, keys, audit</text>
  <text class="m" x="626" y="236" font-size="12">AES-GCM sealed secrets</text>
  <text class="m" x="626" y="254" font-size="12">egress / SSRF guard, ingress rules</text>

  <!-- scheduler -->
  <rect class="accent" x="40" y="290" width="230" height="90" rx="8"/>
  <text class="t" x="56" y="312" font-size="14" font-weight="600">Scheduler (G-M-P)</text>
  <text class="m" x="56" y="332" font-size="12">admission, per-tenant fairness</text>
  <text class="m" x="56" y="350" font-size="12">work stealing, CPU + wall limits</text>
  <text class="m" x="56" y="368" font-size="12">memory governor</text>
  <path class="line" d="M155 272 V290" marker-end="url(#a)"/>

  <!-- executors -->
  <rect class="teal" x="325" y="290" width="230" height="90" rx="8"/>
  <text class="t" x="341" y="312" font-size="14" font-weight="600">Executors</text>
  <text class="m" x="341" y="332" font-size="12">Deno: fresh V8 isolate per task</text>
  <text class="m" x="341" y="350" font-size="12">WASM: wasmtime component per task</text>
  <text class="m" x="341" y="368" font-size="12">opt-in warm reuse (min_latency)</text>
  <path class="line" d="M270 335 H325" marker-end="url(#a)"/>
  <path class="line" d="M440 272 V290" marker-end="url(#a)"/>

  <!-- host -->
  <rect class="box" x="610" y="290" width="230" height="90" rx="8"/>
  <text class="t" x="626" y="312" font-size="14" font-weight="600">Host capabilities: std:*</text>
  <text class="m" x="626" y="332" font-size="12">kv, sql, sqlite, blob, queue, lock</text>
  <text class="m" x="626" y="350" font-size="12">services, sockets, durable, sdk</text>
  <text class="m" x="626" y="368" font-size="12">fetch through the egress guard</text>
  <path class="line" d="M555 335 H610" marker-end="url(#a)"/>

  <!-- storage -->
  <rect class="box" x="20" y="420" width="840" height="80" rx="12"/>
  <text class="t" x="36" y="444" font-size="14" font-weight="600">One data volume</text>
  <text class="m" x="36" y="466" font-size="12">meta.db + queue.db (SQLite, WAL)   ·   services/&lt;id&gt;/data.db (KV + SQL per service)   ·   blobs/&lt;id&gt;/</text>
  <text class="m" x="36" y="486" font-size="12">artifacts/&lt;sha256&gt;/   ·   logs/&lt;id&gt;/   ·   cache/ (rebuildable)   ·   master key from env or a file (kept apart from backups)</text>
  <path class="line" d="M725 380 V420" marker-end="url(#a)"/>
  <path class="line" d="M725 272 V290" marker-end="url(#a)"/>
</svg>
