[package]
name = "rt-fixture-hello"
version = "0.0.0"
edition = "2021"
publish = false
description = "WSM-01 / outcome mapping: wasi:http hello component"

# A cdylib built for `wasm32-wasip2` is already a WebAssembly component; the `wasip2` crate
# embeds the `wasi:http/proxy` world, so it exports `wasi:http/incoming-handler`.
[lib]
crate-type = ["cdylib"]

[dependencies]
wasip2 = "2"
# Bindings for `std:host/secrets` generated from /wit/rt-host.wit (the `/secret` route).
wit-bindgen = { version = "0.62", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# Standalone crate: NOT a member of the runtime workspace.
[workspace]
