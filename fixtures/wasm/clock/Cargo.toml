[package]
name = "rt-fixture-clock"
version = "0.0.0"
edition = "2021"
publish = false
description = "WSM-11 / SEC-22: wasi:clocks around a busy loop"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasip2 = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# Standalone crate: NOT a member of the runtime workspace.
[workspace]
