[package]
name = "rt-fixture-rpc"
version = "0.0.0"
edition = "2021"
publish = false
description = "WSM-RPC: serves RPC through the std:host/rpc export and calls one through std:host/call call-rpc"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasip2 = "2"
# Bindings for world `rpc-service` (std:host imports + the `rpc` export) from /wit/rt-host.wit;
# `wasi:http/proxy` comes from `wasip2`.
wit-bindgen = { version = "0.62", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# Standalone crate: NOT a member of the runtime workspace.
[workspace]
