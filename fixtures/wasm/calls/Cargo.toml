[package]
name = "rt-fixture-calls"
version = "0.0.0"
edition = "2021"
publish = false
description = "WSM-15: calls another service and enqueues through std:host/call and std:host/queue"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasip2 = "2"
# Bindings for `std:host/{call,queue}` generated from /wit/rt-host.wit; `wasi:http/proxy` comes from `wasip2`.
wit-bindgen = { version = "0.62", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# Standalone crate: NOT a member of the runtime workspace.
[workspace]
