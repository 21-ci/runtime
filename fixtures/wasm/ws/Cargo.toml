[package]
name = "rt-fixture-ws"
version = "0.0.0"
edition = "2021"
publish = false
description = "WSM-WS: WebSockets and durable storage through std:host/sockets, std:host/durable and the socket-handler export"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasip2 = "2"
# Bindings for world `socket-service` (std:host imports + the `socket-handler` export) from
# /wit/rt-host.wit; `wasi:http/proxy` comes from `wasip2`.
wit-bindgen = { version = "0.62", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# Standalone crate: NOT a member of the runtime workspace.
[workspace]
